<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pupitre — Bibliothèque de cor</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="valve-rail" aria-hidden="true">
  <div class="pipe"></div>
</div>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-text">
      <p class="eyebrow">Pupitre Cor d'harmonie</p>
      <h1>Tout<br>dans le<span>pavillon</span></h1>
      <p class="lede">Toutes mes partitions, rangées comme sur un pupitre&nbsp;: le PDF pour lire, le MIDI pour entendre avant de jouer.</p>
    </div>
    <svg class="horn-signature" viewBox="0 0 440 380" aria-hidden="true">
      <defs>
        <radialGradient id="bellGrad" cx="35%" cy="32%" r="75%">
          <stop offset="0%" stop-color="var(--gold-bright)" stop-opacity="0.85"/>
          <stop offset="55%" stop-color="var(--gold)" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="var(--copper)" stop-opacity="0.22"/>
        </radialGradient>
      </defs>

      <!-- embouchure et tige -->
      <path class="horn-mouthpiece-shank" d="M42 70 L 60 78" />
      <circle class="horn-mouthpiece" cx="40" cy="66" r="9" />

      <!-- tuyau d'embouchure -->
      <path class="horn-lead" d="M48 72 C 84 78 114 96 140 122" />

      <!-- enroulement du tube -->
      <g class="horn-coil">
        <circle class="horn-coil-outer" cx="188" cy="192" r="108" />
        <circle class="horn-coil-mid" cx="188" cy="192" r="76" />
        <circle class="horn-coil-inner" cx="188" cy="192" r="44" />
      </g>

      <!-- coulisse d'accord qui dépasse -->
      <path class="horn-slide" d="M92 150 C 66 150 58 174 68 192 C 78 210 98 212 112 198" />

      <!-- pistons et leurs coulisses -->
      <g class="valve">
        <path class="horn-valve-slide" d="M160 118 C 160 100 176 100 176 118" />
        <rect x="168" y="150" width="13" height="30" rx="4"/>
        <path class="horn-valve-slide" d="M182 118 C 182 100 198 100 198 118" />
        <rect x="190" y="150" width="13" height="30" rx="4"/>
        <path class="horn-valve-slide" d="M204 118 C 204 100 220 100 220 118" />
        <rect x="212" y="150" width="13" height="30" rx="4"/>
      </g>

      <!-- tube de sortie vers le pavillon -->
      <path class="horn-lead" d="M270 250 C 310 275 345 268 372 250" />

      <!-- pavillon -->
      <path class="horn-bell" d="M372 250 C 404 232 434 244 438 278 C 442 316 404 348 362 344 C 330 341 310 316 308 288 C 307 272 320 258 340 252 Z" />
      <ellipse class="horn-bell-rim" cx="392" cy="292" rx="34" ry="46" transform="rotate(18 392 292)" />
    </svg>
  </div>
</header>

<main>
  <section class="controls" aria-label="Filtres">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Chercher un titre, un compositeur…" autocomplete="off">
    </div>
    <div class="valves" id="category-filters" role="group" aria-label="Filtrer par catégorie"></div>
  </section>

  <section class="stats" id="stats" aria-live="polite"></section>

  <section class="rack" id="rack"></section>

  <p class="empty-state" id="empty-state" hidden>Aucune partition ne correspond — vérifie l'orthographe ou change de valve.</p>
</main>

<footer>
  <p>Bibliothèque personnelle — Appartenant à <code>SCHAUM Chloé</code>.</p>
</footer>

<template id="card-template">
  <article class="card">
    <div class="card-top">
      <div class="card-top-tags">
        <span class="tag tag-group" data-field="group"></span>
        <span class="tag" data-field="category"></span>
      </div>
      <span class="key" data-field="key"></span>
    </div>
    <h2 data-field="title"></h2>
    <p class="composer" data-field="composer"></p>
    <p class="opus" data-field="opus"></p>
    <div class="card-actions">
      <a class="btn-score" data-field="pdfLink" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 2h9l5 5v15H6z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14 2v6h6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        Voir la partition
      </a>
      <div class="audio-slot" data-field="audioSlot"></div>
    </div>
  </article>
</template>

<script src="data/scores.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
