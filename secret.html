<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>??? — Pupitre Cor d'harmonie</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .secret-main{
    max-width: 640px;
    margin: 0 auto;
    padding: 60px 28px 100px;
    text-align: center;
  }
  .secret-eyebrow{
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-bright);
    margin: 0 0 14px;
  }
  .secret-title{
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: clamp(30px, 5vw, 44px);
    margin: 0 0 14px;
    color: var(--ivory);
  }
  .secret-lede{
    color: var(--ivory-dim);
    font-size: 15.5px;
    line-height: 1.6;
    margin: 0 0 40px;
  }

  .horn-body{
    display: flex;
    justify-content: center;
    gap: 22px;
    margin: 0 auto 36px;
  }

  .palette{
    --tone: var(--gold);
    width: 84px;
    height: 130px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--panel-alt), var(--panel));
    box-shadow: var(--shadow), inset 0 2px 0 rgba(255,255,255,0.04);
    cursor: pointer;
    position: relative;
    transition: transform .08s ease, box-shadow .15s ease, border-color .15s ease;
    padding: 0;
  }
  .palette:hover{ border-color: var(--gold); }
  .palette::before{
    content: "";
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    width: 46px; height: 46px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-bright), var(--copper));
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25);
    opacity: 0.35;
    transition: opacity .12s ease, box-shadow .12s ease;
  }
  .palette.lit{
    transform: translateY(6px);
  }
  .palette.lit::before{
    opacity: 1;
    box-shadow: 0 0 26px 6px rgba(232,200,90,0.55), inset 0 0 0 2px rgba(0,0,0,0.25);
  }
  .palette-label{
    position: absolute;
    bottom: 14px;
    left: 0; right: 0;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ivory-dim);
    letter-spacing: 0.06em;
  }

  .secret-status{
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--ivory-dim);
    letter-spacing: 0.03em;
    margin: 0 0 26px;
    min-height: 18px;
  }
  .secret-score{
    display: flex;
    justify-content: center;
    gap: 34px;
    margin: 0 0 30px;
  }
  .secret-score div{ text-align: center; }
  .secret-score .num{
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 30px;
    color: var(--gold-bright);
    display: block;
  }
  .secret-score .lbl{
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ivory-dim);
  }

  .secret-btn{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 999px;
    background: var(--gold);
    color: var(--bg-deep);
    border: none;
    font-family: "Work Sans", sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .18s ease, transform .18s ease;
  }
  .secret-btn:hover{ background: var(--gold-bright); transform: translateY(-1px); }
  .secret-btn:disabled{
    pointer-events: none;
    opacity: 0.5;
  }

  .secret-back{
    display: inline-block;
    margin-top: 44px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--ivory-dim);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color .18s ease, border-color .18s ease;
  }
  .secret-back:hover{ color: var(--gold-bright); border-color: var(--gold); }

  @media (max-width: 460px){
    .palette{ width: 64px; height: 104px; }
    .palette::before{ width: 36px; height: 36px; top: 10px; }
  }
</style>
</head>
<body>

<header class="hero" style="border-bottom:none;">
  <div class="hero-inner" style="justify-content:center;">
    <div class="hero-text" style="text-align:center; max-width: 640px;">
      <p class="eyebrow" style="margin: 0 auto 14px;">📯 Salle des palettes</p>
      <h1 style="text-align:center;">Bravo, tu as trouvé<br>le <span>passage secret</span></h1>
    </div>
  </div>
</header>

<main class="secret-main">
  <p class="secret-lede">
    Un cor a 3 palettes. Écoute la mélodie, puis rejoue-la dans le même ordre.
    Chaque tour ajoute une note.
  </p>

  <div class="secret-score">
    <div><span class="num" id="score-current">0</span><span class="lbl">Manche</span></div>
    <div><span class="num" id="score-best">0</span><span class="lbl">Record</span></div>
  </div>

  <div class="horn-body">
    <button class="palette" data-note="0" aria-label="Palette 1"><span class="palette-label">1</span></button>
    <button class="palette" data-note="1" aria-label="Palette 2"><span class="palette-label">2</span></button>
    <button class="palette" data-note="2" aria-label="Palette 3"><span class="palette-label">3</span></button>
  </div>

  <p class="secret-status" id="status">Clique sur « Commencer » pour jouer.</p>

  <button class="secret-btn" id="start-btn">Commencer</button>

  <div>
    <a href="galerie.html" class="secret-back">← Retour à la galerie, personne n'a rien vu</a>
  </div>
</main>

<script>
(function () {
  const palettes = Array.from(document.querySelectorAll(".palette"));
  const statusEl = document.getElementById("status");
  const startBtn = document.getElementById("start-btn");
  const scoreCurrentEl = document.getElementById("score-current");
  const scoreBestEl = document.getElementById("score-best");

  const BEST_KEY = "cor-palettes-record";
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  scoreBestEl.textContent = best;

  // Fréquences façon fa/la/do (cor en fa, simplifié) pour les 3 palettes
  const FREQS = [349.23, 440.0, 523.25];

  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playNote(index, duration = 0.32) {
    const ctx = ensureAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.value = FREQS[index];
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration + 0.02);
  }

  function litPulse(index, duration = 320) {
    const el = palettes[index];
    el.classList.add("lit");
    playNote(index, duration / 1000);
    setTimeout(() => el.classList.remove("lit"), duration);
  }

  let sequence = [];
  let playerStep = 0;
  let accepting = false;
  let round = 0;

  function updateScore() {
    scoreCurrentEl.textContent = round;
  }

  async function playSequence() {
    accepting = false;
    statusEl.textContent = "Écoute...";
    await sleep(500);
    for (let i = 0; i < sequence.length; i++) {
      litPulse(sequence[i], 380);
      await sleep(480);
    }
    playerStep = 0;
    accepting = true;
    statusEl.textContent = "À toi de jouer.";
  }

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  function nextRound() {
    round += 1;
    updateScore();
    sequence.push(Math.floor(Math.random() * 3));
    playSequence();
  }

  function gameOver() {
    accepting = false;
    statusEl.textContent = `Perdu à la manche ${round}. Réessaie !`;
    if (round - 1 > best) {
      best = round - 1;
      localStorage.setItem(BEST_KEY, String(best));
      scoreBestEl.textContent = best;
      statusEl.textContent += " Nouveau record !";
    }
    startBtn.disabled = false;
    startBtn.textContent = "Rejouer";
  }

  palettes.forEach((btn, index) => {
    btn.addEventListener("click", () => {
      if (!accepting) return;
      litPulse(index, 250);

      if (sequence[playerStep] !== index) {
        gameOver();
        return;
      }

      playerStep += 1;
      if (playerStep === sequence.length) {
        accepting = false;
        statusEl.textContent = "Bien joué !";
        setTimeout(nextRound, 700);
      }
    });
  });

  startBtn.addEventListener("click", () => {
    ensureAudio();
    sequence = [];
    round = 0;
    updateScore();
    startBtn.disabled = true;
    startBtn.textContent = "En cours…";
    nextRound();
  });
})();
</script>

</body>
</html>
